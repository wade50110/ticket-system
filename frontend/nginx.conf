server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反代 API 到後端 k8s Service(ticket-backend 由 k8s DNS 解析,
    # ClusterIP Service 會負載均衡到多個 backend pod)。
    # 這段要放在 SPA fallback 之前,才不會被 / 的 try_files 吃掉。
    location /api/ {
        proxy_pass http://ticket-backend:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 搶票結帳可能較久,放寬 timeout
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA fallback:CSR 前端路由,非實體檔案的路徑都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取(index.html 不快取,確保部署後拿到新版)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
